<style>
:root {
  --navy:    #0f2555;
  --blue:    #1a3a6e;
  --mid:     #2756a8;
  --accent:  #4a8ef5;
  --gold:    #e8b800;
  --card-bg: rgba(255,255,255,0.94);
  --text:    #0f1e3d;
  --muted:   #4a5a7a;
  --border:  rgba(42,86,168,0.18);
  --danger:  #dc2626;
  --success: #16a34a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  background: linear-gradient(160deg, #0f2555 0%, #1a3a6e 45%, #2756a8 100%);
  color: var(--text);
}

/* HEADER */
header {
  padding: 48px 20px 28px;
  text-align: center;
  position: relative;
}

.logo-box img {
  width: 160px;
  max-width: 80%;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  margin-bottom: 14px;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 5vw, 28px);
  color: #fff;
  letter-spacing: 0.03em;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

header p {
  color: rgba(255,255,255,0.65);
  font-size: 13px;
  margin-top: 4px;
  font-weight: 300;
}

.admin-btn {
  position: absolute;
  top: 20px;
  right: 16px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: background 0.2s;
}
.admin-btn:hover { background: rgba(255,255,255,0.22); }
.admin-btn.active { background: var(--gold); border-color: var(--gold); color: #1a1a00; font-weight: 600; }

/* STATS */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding: 0 16px 24px;
}
.stat { text-align: center; }
.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  color: #fff;
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
}

/* SEARCH */
.search-wrap { padding: 0 16px 20px; }
.search-inner { position: relative; }
.search-inner svg {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search-inner input {
  width: 100%;
  padding: 15px 16px 15px 46px;
  border-radius: 16px;
  border: none;
  background: rgba(255,255,255,0.95);
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  outline: none;
  transition: box-shadow 0.2s;
}
.search-inner input:focus { box-shadow: 0 4px 24px rgba(74,142,245,0.4); }

/* ADD CARGO BTN */
#add-cargo-btn {
  display: none;
  margin: 0 12px 16px;
  width: calc(100% - 24px);
  padding: 14px;
  border-radius: 16px;
  border: 2px dashed rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: background 0.2s;
}
#add-cargo-btn:hover { background: rgba(255,255,255,0.15); }
.is-admin #add-cargo-btn { display: block; }

/* CARDS */
#list { padding: 0 12px 100px; display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  animation: fadeUp 0.35s ease both;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

.cargo-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(90deg, rgba(42,86,168,0.07), transparent);
}
.cargo-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--blue);
  flex: 1;
}
.cargo-count {
  font-size: 11px;
  background: rgba(42,86,168,0.1);
  color: var(--mid);
  border-radius: 999px;
  padding: 3px 10px;
  font-weight: 600;
  margin-right: 6px;
}

.pessoa {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  font-size: 14px;
  gap: 8px;
}
.pessoa:not(:last-child) { border-bottom: 1px dashed rgba(42,86,168,0.12); }
.pessoa-nome { flex: 1; font-weight: 400; color: var(--text); }

.funcao {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  background: #e8f0ff;
  color: #1e3a8a;
  white-space: nowrap;
}
.funcao.diretor { background: var(--mid); color: #fff; }
.funcao.equipe  { background: #f0fdf4; color: #166534; }

/* ADMIN CONTROLS */
.admin-controls { display: none; gap: 5px; align-items: center; }
.is-admin .admin-controls { display: flex; }

.btn-icon {
  width: 28px; height: 28px;
  border-radius: 8px; border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: background 0.15s, transform 0.1s;
}
.btn-icon:active { transform: scale(0.88); }
.btn-edit { background: #eff6ff; color: #2563eb; }
.btn-edit:hover { background: #dbeafe; }
.btn-del  { background: #fef2f2; color: #dc2626; }
.btn-del:hover  { background: #fee2e2; }

.cargo-admin-row {
  display: none;
  padding: 8px 16px 12px;
  gap: 8px;
  border-top: 1px dashed var(--border);
}
.is-admin .cargo-admin-row { display: flex; }

.btn-add-person {
  flex: 1;
  padding: 8px;
  border-radius: 10px;
  border: 1.5px dashed var(--mid);
  background: transparent;
  color: var(--mid);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: background 0.15s;
}
.btn-add-person:hover { background: rgba(42,86,168,0.06); }

.btn-del-cargo {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1.5px dashed var(--danger);
  background: transparent;
  color: var(--danger);
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-del-cargo:hover { background: #fef2f2; }

/* SAVE BAR */
#save-bar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--navy);
  border-top: 1px solid rgba(255,255,255,0.1);
  z-index: 100;
  gap: 10px;
  align-items: center;
}
.is-admin #save-bar { display: flex; }
.save-info { flex: 1; color: rgba(255,255,255,0.7); font-size: 13px; }
.save-info strong { color: #fff; display: block; font-size: 14px; }

#btn-save {
  padding: 12px 22px;
  border-radius: 12px;
  border: none;
  background: var(--gold);
  color: #1a1a00;
  font-size: 14px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
#btn-save:disabled { opacity: 0.5; cursor: default; }

/* MODAIS */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: popIn 0.22s ease;
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.92); }
  to   { opacity:1; transform:scale(1); }
}

.modal h3 {
  font-family: 'Playfair Display', serif;
  color: var(--blue);
  margin-bottom: 18px;
  font-size: 19px;
}

.field-group { margin-top: 14px; }
.field-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.field-group input,
.field-group select {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.field-group input:focus,
.field-group select:focus { border-color: var(--accent); }

.modal-actions {
  display: flex; gap: 10px; margin-top: 22px;
}
.btn-cancel {
  flex: 1; padding: 12px; border-radius: 12px;
  border: 1.5px solid var(--border);
  background: #fff; color: var(--muted);
  font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.btn-confirm {
  flex: 2; padding: 12px; border-radius: 12px;
  border: none; background: var(--blue); color: #fff;
  font-size: 14px; font-weight: 600;
  font-family: 'DM Sans', sans-serif; cursor: pointer;
  transition: background 0.2s;
}
.btn-confirm:hover { background: var(--mid); }

.login-logo { text-align: center; margin-bottom: 16px; }
.login-logo img { width: 72px; }
.login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

/* TOAST */
#toast {
  position: fixed;
  bottom: 88px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: #1e293b; color: #fff;
  padding: 11px 22px;
  border-radius: 999px;
  font-size: 14px;
  opacity: 0;
  transition: all 0.28s;
  z-index: 300;
  white-space: nowrap;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { background: #15803d; }
#toast.error   { background: var(--danger); }

footer {
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  padding: 4px 10px 20px;
}

.empty {
  text-align: center; padding: 48px 20px;
  color: rgba(255,255,255,0.5); font-size: 15px;
}
.empty span { font-size: 40px; display: block; margin-bottom: 12px; }
</style>

  </div>
</div>

<!-- ADD CARGO MODAL -->
<div class="modal-overlay" id="cargo-modal">

    <div class="field-group">

data.sort((a,b) => a.cargo.localeCompare(b.cargo,"pt-BR"));

// ── UTILS ──
function normalize(t){ return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

function showToast(msg, type="") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = "", 2800);
}

function setChanged(yes) {
  hasChanges = yes;
  document.getElementById("save-status").innerHTML = yes
    ? '<span style="color:#fbbf24">● Alterações não salvas</span>'
    : 'Nenhuma alteração';
}

// ── STATS ──
function renderStats() {
  const uniq = new Set(data.flatMap(d => d.pessoas.map(p => p.nome))).size;
  document.getElementById("stats-bar").innerHTML = `
    <div class="stat"><div class="stat-num">${data.length}</div><div class="stat-label">Cargos</div></div>
    <div class="stat"><div class="stat-num">${uniq}</div><div class="stat-label">Membros</div></div>
    <div class="stat"><div class="stat-num">${data.reduce((s,d)=>s+d.pessoas.length,0)}</div><div class="stat-label">Nomeações</div></div>
  `;
}

// ── RENDER ──
function render(filter="") {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const f = normalize(filter);
  let count = 0;

  data.forEach((item, ci) => {
    const cargoMatch = normalize(item.cargo).includes(f);
    const matched = item.pessoas.filter(p =>
      normalize(p.nome).includes(f) || (p.funcao && normalize(p.funcao).includes(f))
    );
    if (!cargoMatch && matched.length === 0) return;
    const showList = cargoMatch ? item.pessoas : matched;
    count++;

    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = Math.min(count * 0.04, 0.4) + "s";

    let html = `
      <div class="cargo-header">
        <span class="cargo-title">${item.cargo}</span>
        <span class="cargo-count">${item.pessoas.length}</span>
        <div class="admin-controls">
          <button class="btn-icon btn-edit" title="Renomear cargo" onclick="openEditCargo(${ci})">✏️</button>
        </div>
      </div>
    `;

    showList.forEach(p => {
      const pi = item.pessoas.indexOf(p);
      const isDiretor = p.funcao && normalize(p.funcao).startsWith("diretor");
      const isEquipe  = p.funcao && normalize(p.funcao) === "equipe";
      html += `
        <div class="pessoa">
          <span class="pessoa-nome">${p.nome}</span>
          ${p.funcao ? `<span class="funcao ${isDiretor?"diretor":""} ${isEquipe?"equipe":""}">${p.funcao}</span>` : ""}
          <div class="admin-controls" style="margin-left:6px">
            <button class="btn-icon btn-edit" onclick="openEditPessoa(${ci},${pi})">✏️</button>
            <button class="btn-icon btn-del"  onclick="removePessoa(${ci},${pi})">🗑️</button>
          </div>
        </div>
      `;
    });

    html += `
      <div class="cargo-admin-row">
        <button class="btn-add-person" onclick="openAddPessoa(${ci})">＋ Adicionar pessoa</button>
        <button class="btn-del-cargo"  onclick="removeCargo(${ci})">🗑️ Remover cargo</button>
      </div>
    `;

    card.innerHTML = html;
    list.appendChild(card);
  });

  if (count === 0) {
    list.innerHTML = `<div class="empty"><span>🔍</span>Nenhum resultado encontrado</div>`;
  }
  renderStats();
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));

// ── ADMIN ──
function toggleAdmin() {
  if (isAdmin) {
    if (hasChanges && !confirm("Sair sem salvar? As alterações não salvas serão perdidas.")) return;
    isAdmin = false;
    hasChanges = false;
    document.body.classList.remove("is-admin");
    document.getElementById("toggle-admin-btn").classList.remove("active");
    document.getElementById("toggle-admin-btn").textContent = "⚙️ Admin";
    render(document.getElementById("search").value);
  } else {
    openModal("login-modal");
    setTimeout(() => document.getElementById("login-senha").focus(), 150);
  }
}

function doLogin() {
  if (document.getElementById("login-senha").value === ADMIN_PASS) {
    isAdmin = true;
    document.body.classList.add("is-admin");
    document.getElementById("toggle-admin-btn").classList.add("active");
    document.getElementById("toggle-admin-btn").textContent = "✅ Admin";
    closeModal("login-modal");
    document.getElementById("login-senha").value = "";
    document.getElementById("login-error").style.display = "none";
    render(document.getElementById("search").value);
    showToast("Modo admin ativado!", "success");
  } else {
    document.getElementById("login-error").style.display = "block";
    document.getElementById("login-senha").select();
  }
}

function openModal(id)  { document.getElementById(id).classList.add("open"); }
function closeModal(id) {
  document.getElementById(id).classList.remove("open");
  // reset funcao group visibility
  document.getElementById("funcao-group").style.display = "";
}

// ── EDIT PESSOA ──
function openEditPessoa(ci, pi) {
  const p = data[ci].pessoas[pi];
  document.getElementById("edit-title").textContent = "Editar Pessoa";
  document.getElementById("edit-nome").value = p.nome;
  document.getElementById("edit-funcao").value = p.funcao || "";
  document.getElementById("funcao-group").style.display = "";
  openModal("edit-modal");
  document.getElementById("edit-confirm").onclick = () => {
    const nome = document.getElementById("edit-nome").value.trim();
    if (!nome) { showToast("Nome não pode ser vazio","error"); return; }
    data[ci].pessoas[pi].nome = nome;
    const f = document.getElementById("edit-funcao").value;
    if (f) data[ci].pessoas[pi].funcao = f;
    else   delete data[ci].pessoas[pi].funcao;
    closeModal("edit-modal");
    setChanged(true);
    render(document.getElementById("search").value);
    showToast("Pessoa atualizada!");
  };
}

// ── ADD PESSOA ──
function openAddPessoa(ci) {
  document.getElementById("edit-title").textContent = "Adicionar Pessoa";
  document.getElementById("edit-nome").value = "";
  document.getElementById("edit-funcao").value = "";
  document.getElementById("funcao-group").style.display = "";
  openModal("edit-modal");
  document.getElementById("edit-confirm").onclick = () => {
    const nome = document.getElementById("edit-nome").value.trim();
    if (!nome) { showToast("Nome não pode ser vazio","error"); return; }
    const f = document.getElementById("edit-funcao").value;
    data[ci].pessoas.push(f ? {nome, funcao:f} : {nome});
    closeModal("edit-modal");
    setChanged(true);
    render(document.getElementById("search").value);
    showToast("Pessoa adicionada!", "success");
  };
}

// ── REMOVE PESSOA ──
function removePessoa(ci, pi) {
  if (!confirm(`Remover "${data[ci].pessoas[pi].nome}" de "${data[ci].cargo}"?`)) return;
  data[ci].pessoas.splice(pi, 1);
  setChanged(true);
  render(document.getElementById("search").value);
  showToast("Pessoa removida.");
}

// ── EDIT CARGO (renomear) ──
function openEditCargo(ci) {
  document.getElementById("edit-title").textContent = "Renomear Cargo";
  document.getElementById("edit-nome").value = data[ci].cargo;
  document.getElementById("funcao-group").style.display = "none";
  openModal("edit-modal");
  document.getElementById("edit-confirm").onclick = () => {
    const nome = document.getElementById("edit-nome").value.trim();
    if (!nome) { showToast("Nome não pode ser vazio","error"); return; }
    data[ci].cargo = nome;
    data.sort((a,b) => a.cargo.localeCompare(b.cargo,"pt-BR"));
    closeModal("edit-modal");
    setChanged(true);
    render(document.getElementById("search").value);
    showToast("Cargo renomeado!");
  };
}

// ── ADD CARGO ──
function openAddCargo() {
  document.getElementById("cargo-nome").value = "";
  openModal("cargo-modal");
  setTimeout(() => document.getElementById("cargo-nome").focus(), 150);
}

function confirmAddCargo() {
  const nome = document.getElementById("cargo-nome").value.trim();
  if (!nome) { showToast("Nome não pode ser vazio","error"); return; }
  data.push({ cargo: nome, pessoas: [] });
  data.sort((a,b) => a.cargo.localeCompare(b.cargo,"pt-BR"));
  closeModal("cargo-modal");
  setChanged(true);
  render(document.getElementById("search").value);
  showToast("Cargo criado!", "success");
}

// ── REMOVE CARGO ──
function removeCargo(ci) {
  if (!confirm(`Remover o cargo "${data[ci].cargo}" e todos os seus membros?`)) return;
  data.splice(ci, 1);
  setChanged(true);
  render(document.getElementById("search").value);
  showToast("Cargo removido.");
}

// ── SAVE TO GITHUB ──
async function saveToGitHub() {
  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.textContent = "⏳ Salvando…";

  try {
    // 1. Buscar SHA atual
    const getRes = await fetch(
      `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}?ref=${GITHUB_BRANCH}`,
      { headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: "application/vnd.github.v3+json" } }
    );
    if (!getRes.ok) throw new Error("Não foi possível acessar o repositório (" + getRes.status + ")");
    const { sha } = await getRes.json();

    // 2. Gerar novo HTML com os dados atualizados
    const newHTML = buildNewHTML();
    const encoded = btoa(unescape(encodeURIComponent(newHTML)));

    // 3. Commit
    const putRes = await fetch(
      `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: "PUT",
        headers: { Authorization: `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: `Admin: atualização de cargos (${new Date().toLocaleDateString("pt-BR")})`,
          content: encoded,
          sha,
          branch: GITHUB_BRANCH
        })
      }
    );
    if (!putRes.ok) {
      const err = await putRes.json();
      throw new Error(err.message || "Erro ao fazer commit");
    }

    setChanged(false);
    document.getElementById("save-status").innerHTML = '<span style="color:#4ade80">✓ Salvo com sucesso</span>';
    showToast("✅ Alterações salvas no GitHub!", "success");

  } catch (e) {
    showToast("❌ " + e.message, "error");
    console.error(e);
  }

  btn.disabled = false;
  btn.textContent = "💾 Salvar";
}

// ── BUILD NEW HTML (substitui só o bloco de data) ──
function buildNewHTML() {
  const html = document.documentElement.outerHTML;
  const dataStr = JSON.stringify(data, null, 2);
  // Substitui o bloco let data = [...]; no HTML
  return html.replace(
    /let data = \[[\s\S]*?\];\s*\n(\s*data\.sort)/,
    `let data = ${dataStr};\n\n$1`
  );
}
