<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CARGOS IASD IGUAÍBA – 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#d9f0ff;
  --bg2:#eef8ff;
  --card:#dff1ff;
  --border:#b6dbf2;
  --primary:#1f5fa8;
  --secondary:#2b7cd3;
  --text:#1e293b;
  --muted:#4a6fa5;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
}

/* ===== TOPO ===== */
header{
  padding:24px 16px 10px;
  text-align:center;
}

header img{
  width:140px;
  margin-bottom:6px;
}

header h1{
  margin:6px 0 0;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

/* ===== BUSCA ===== */
.search{
  padding:14px 16px;
}

.search input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#ffffff;
  font-size:16px;
}

/* ===== LISTA ===== */
#lista{
  padding:0 12px 30px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 6px 14px rgba(0,0,0,.08);
}

.cargo{
  font-size:17px;
  font-weight:700;
  color:var(--primary);
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
  margin-bottom:10px;
}

.pessoa{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  font-size:15px;
}

.pessoa:not(:last-child){
  border-bottom:1px dashed var(--border);
}

.funcao{
  font-size:12px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  background:#ffffff;
  border:1px solid var(--border);
  color:var(--muted);
}

.funcao.diretor{
  background:var(--secondary);
  color:#fff;
  border-color:var(--secondary);
}

footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:20px 10px 30px;
}
</style>
</head>

<body>

<header>
  <img src="logo-iasd.png" alt="Logo IASD">
  <h1>CARGOS IASD IGUAÍBA – 2026</h1>
</header>

<div class="search">
  <input type="text" id="search" placeholder="🔍 Pesquisar nome, cargo ou função">
</div>

<div id="lista"></div>

<footer>
  Igreja Adventista do Sétimo Dia • Iguaíba • 2026
</footer>

<script>
const dados = [
  {
    cargo:"Ação Solidária Adventista",
    pessoas:[
      {nome:"Josiane Gomes",funcao:"Diretora"},
      {nome:"Inácia Costa",funcao:"Associada"}
    ]
  },
  {
    cargo:"Ancião Administrativo",
    pessoas:[
      {nome:"José Ribamar Junior"}
    ]
  },
  {
    cargo:"Ancionato",
    pessoas:[
      {nome:"Fernando Silva"},
      {nome:"Iago Ricardo"},
      {nome:"Jailson Ribeiro"},
      {nome:"José Ribamar Junior"}
    ]
  },
  {
    cargo:"Círculo de Oração",
    pessoas:[
      {nome:"Benerides Selares",funcao:"Diretora"}
    ]
  },
  {
    cargo:"Comunicação",
    pessoas:[
      {nome:"Ellayne Crystine",funcao:"Diretora"},
      {nome:"Eliedson Raposo",funcao:"Associado"}
    ]
  },
  {
    cargo:"Diáconos",
    pessoas:[
      {nome:"Amarildo Silva",funcao:"Chefe"},
      {nome:"Alcionor Frazão"},
      {nome:"Fernando Silva"},
      {nome:"Aldonio Vieira"},
      {nome:"Hermes Junior"},
      {nome:"Iago Ricardo"},
      {nome:"Igor Rodrigo"},
      {nome:"Jardson Frazão"},
      {nome:"Jonathan Pereira"},
      {nome:"Jonns William"},
      {nome:"Joseph Santos"},
      {nome:"Leandro Silva"}
    ]
  },
  {
    cargo:"Liberdade Religiosa",
    pessoas:[
      {nome:"Iago Ricardo",funcao:"Diretor"}
    ]
  },
  {
    cargo:"Tesouraria",
    pessoas:[
      {nome:"Jonathan Pereira",funcao:"Diretor"},
      {nome:"Yan Cristhian",funcao:"Associado"}
    ]
  }
];

dados.sort((a,b)=>a.cargo.localeCompare(b.cargo,"pt-BR"));

const lista=document.getElementById("lista");
const search=document.getElementById("search");

function render(filtro=""){
  lista.innerHTML="";
  dados.forEach(item=>{
    const cargoMatch=item.cargo.toLowerCase().includes(filtro);
    const pessoas=item.pessoas.filter(p=>
      p.nome.toLowerCase().includes(filtro) ||
      (p.funcao && p.funcao.toLowerCase().includes(filtro))
    );
    if(!cargoMatch && pessoas.length===0) return;

    const card=document.createElement("div");
    card.className="card";

    let html=`<div class="cargo">${item.cargo}</div>`;
    (cargoMatch?item.pessoas:pessoas).forEach(p=>{
      const isDir=p.funcao && p.funcao.toLowerCase().includes("diretor");
      html+=`
        <div class="pessoa">
          <span>${p.nome}</span>
          ${p.funcao?`<span class="funcao ${isDir?'diretor':''}">${p.funcao}</span>`:""}
        </div>`;
    });

    card.innerHTML=html;
    lista.appendChild(card);
  });
}

search.addEventListener("input",e=>render(e.target.value.toLowerCase()));
render();
</script>

<!-- OFFLINE -->
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
