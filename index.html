<style>
:root{
  --bg:#020617;
  --card:#020617;
  --border:#1e293b;
  --primary:#38bdf8;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --highlight:#22c55e;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#020617;
  color:var(--text);
}

/* ===== TOPO ===== */
header{
  padding:28px 16px 22px;
  text-align:center;
}

.logo-box{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}

.logo-box img{
  width:90px;
  background:#ffffff;
  padding:10px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
}

header h1{
  margin:10px 0 0;
  font-size:22px;
  font-weight:700;
}

/* ===== BUSCA ===== */
.search-box{
  padding:0 16px 20px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  font-size:16px;
}

/* ===== LISTA ===== */
#list{
  padding:0 12px 32px;
}

.card{
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
}

.cargo{
  font-size:18px;
  font-weight:700;
  color:var(--primary);
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

.pessoa{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  font-size:15px;
}

.pessoa:not(:last-child){
  border-bottom:1px dashed var(--border);
}

.funcao{
  font-size:13px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--muted);
}

.funcao.diretor{
  background:var(--highlight);
  color:#020617;
  border-color:var(--highlight);
}

/* ===== RODAPÉ ===== */
footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:20px 10px 30px;
}
</style>
</head>

data.sort((a,b)=>a.cargo.localeCompare(b.cargo,"pt-BR"));

const list = document.getElementById("list");
const search = document.getElementById("search");

function render(filter=""){
  list.innerHTML="";
  data.forEach(item=>{
    const cargoMatch = item.cargo.toLowerCase().includes(filter);
    const pessoas = item.pessoas.filter(p =>
      p.nome.toLowerCase().includes(filter) ||
      (p.funcao && p.funcao.toLowerCase().includes(filter))
    );
    if(!cargoMatch && pessoas.length===0) return;

    const card=document.createElement("div");
    card.className="card";

    let html=`<div class="cargo">${item.cargo}</div>`;

    (cargoMatch?item.pessoas:pessoas).forEach(p=>{
      const isDiretor = p.funcao && p.funcao.toLowerCase().includes("diretor");
      html+=`
        <div class="pessoa">
          <span>${p.nome}</span>
          ${p.funcao ? `<span class="funcao ${isDiretor?'diretor':''}">${p.funcao}</span>` : ""}
        </div>`;
    });

    card.innerHTML=html;
    list.appendChild(card);
  });
}

search.addEventListener("input",e=>render(e.target.value.toLowerCase()));
