<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CARGOS IASD IGUAÍBA – 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#eaf6ff;
  --card:#dff1ff;
  --border:#b6dbf2;
  --primary:#2b6cb0;
  --text:#1e293b;
  --muted:#4a6fa5;
  --highlight:#3182ce;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:linear-gradient(180deg,#d9f0ff,#eef8ff);
  color:var(--text);
}

/* ===== TOPO ===== */
header{
  padding:26px 16px 18px;
  text-align:center;
}

.logo-box{
  display:flex;
  justify-content:center;
  margin-bottom:6px;
}

.logo-box img{
  width:120px;
  border-radius:22px;
}

header h1{
  margin:8px 0 0;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

/* ===== BUSCA ===== */
.search-box{
  padding:0 16px 18px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#ffffff;
  color:var(--text);
  font-size:16px;
}

/* ===== LISTA ===== */
#list{
  padding:0 12px 32px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 6px 14px rgba(0,0,0,.08);
}

.cargo{
  font-size:17px;
  font-weight:700;
  color:var(--primary);
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

.pessoa{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  font-size:15px;
}

.pessoa:not(:last-child){
  border-bottom:1px dashed var(--border);
}

.funcao{
  font-size:12px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  background:#ffffff;
  border:1px solid var(--border);
  color:var(--muted);
}

.funcao.diretor{
  background:var(--highlight);
  color:#ffffff;
  border-color:var(--highlight);
}

/* ===== RODAPÉ ===== */
footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:20px 10px 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo-box">
    <img src="logo-iasd.png" alt="Igreja Adventista do Sétimo Dia">
  </div>
  <h1>CARGOS IASD IGUAÍBA – 2026</h1>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 Pesquisar nome, cargo ou função">
</div>

<div id="list"></div>

<footer>
  Igreja Adventista do Sétimo Dia • Iguaíba • 2026
</footer>

<script>
let data = [
  { cargo:"Ação Solidária Adventista", pessoas:[
    {nome:"Josiane Gomes", funcao:"Diretora"},
    {nome:"Inácia Costa", funcao:"Associada"}
  ]},
  { cargo:"Ancião Administrativo", pessoas:[
    {nome:"José Ribamar Junior"}
  ]},
  { cargo:"Ancionato", pessoas:[
    {nome:"Fernando Silva"},
    {nome:"Iago Ricardo"},
    {nome:"Jailson Ribeiro"},
    {nome:"José Ribamar Junior"}
  ]},
  { cargo:"Círculo de Oração", pessoas:[
    {nome:"Benerides Selares", funcao:"Diretora"}
  ]},
  { cargo:"Comunicação", pessoas:[
    {nome:"Ellayne Crystine", funcao:"Diretora"},
    {nome:"Eliedson Raposo", funcao:"Associado"}
  ]},
  { cargo:"Diácono Chefe", pessoas:[
    {nome:"Amarildo Silva"}
  ]},
  { cargo:"Diáconos", pessoas:[
    {nome:"Alcionor Frazão"},
    {nome:"Fernando Silva"},
    {nome:"Aldonio Vieira"},
    {nome:"Hermes Junior"},
    {nome:"Iago Ricardo"},
    {nome:"Igor Rodrigo"},
    {nome:"Jardson Frazão"},
    {nome:"Jonathan Pereira"},
    {nome:"Jonns William"},
    {nome:"Joseph Santos"},
    {nome:"Leandro Silva"}
  ]},
  { cargo:"Liberdade Religiosa", pessoas:[
    {nome:"Iago Ricardo", funcao:"Diretor"}
  ]},
  { cargo:"Tesouraria", pessoas:[
    {nome:"Jonathan Pereira", funcao:"Diretor"},
    {nome:"Yan Cristhian", funcao:"Associado"}
  ]}
];

data.sort((a,b)=>a.cargo.localeCompare(b.cargo,"pt-BR"));

const list = document.getElementById("list");
const search = document.getElementById("search");

function render(filter=""){
  list.innerHTML="";
  data.forEach(item=>{
    const cargoMatch = item.cargo.toLowerCase().includes(filter);
    const pessoas = item.pessoas.filter(p =>
      p.nome.toLowerCase().includes(filter) ||
      (p.funcao && p.funcao.toLowerCase().includes(filter))
    );
    if(!cargoMatch && pessoas.length===0) return;

    const card=document.createElement("div");
    card.className="card";

    let html=`<div class="cargo">${item.cargo}</div>`;

    (cargoMatch?item.pessoas:pessoas).forEach(p=>{
      const isDiretor = p.funcao && p.funcao.toLowerCase().includes("diretor");
      html+=`
        <div class="pessoa">
          <span>${p.nome}</span>
          ${p.funcao ? `<span class="funcao ${isDiretor?'diretor':''}">${p.funcao}</span>` : ""}
        </div>`;
    });

    card.innerHTML=html;
    list.appendChild(card);
  });
}

search.addEventListener("input",e=>render(e.target.value.toLowerCase()));
render();
</script>

<!-- REGISTRO DO SERVICE WORKER (OFFLINE) -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => console.log("Service Worker registrado", reg))
      .catch(err => console.log("Erro no Service Worker", err));
  });
}
</script>

</body>
</html>
