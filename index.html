<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CARGOS IASD IGUAÍBA – 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --primary:#1e40af;
  --text:#0f172a;
  --muted:#475569;
  --highlight:#16a34a;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ===== TOPO ===== */
header{
  padding:28px 16px 22px;
  text-align:center;
}

.logo-box{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}

.logo-box img{
  width:100px;
  background:#ffffff;
  padding:12px;
  border-radius:20px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

header h1{
  margin:14px 0 0;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

/* ===== BUSCA ===== */
.search-box{
  padding:0 16px 24px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#ffffff;
  color:var(--text);
  font-size:16px;
}

/* ===== LISTA ===== */
#list{
  padding:0 12px 32px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.cargo{
  font-size:18px;
  font-weight:700;
  color:var(--primary);
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

.pessoa{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  font-size:15px;
}

.pessoa:not(:last-child){
  border-bottom:1px dashed var(--border);
}

.funcao{
  font-size:13px;
  font-weight:600;
  padding:4px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--muted);
}

.funcao.diretor{
  background:var(--highlight);
  color:#ffffff;
  border-color:var(--highlight);
}

/* ===== RODAPÉ ===== */
footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:20px 10px 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo-box">
    <img src="logo-iasd.png" alt="Igreja Adventista do Sétimo Dia">
  </div>
  <h1>CARGOS IASD IGUAÍBA – 2026</h1>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 Pesquisar nome, cargo ou função">
</div>

<div id="list"></div>

<footer>
  Igreja Adventista do Sétimo Dia • Iguaíba • 2026
</footer>

<script>
let data = [ /* ⚠️ DADOS MANTIDOS IGUAIS — OMITIDOS AQUI POR BREVIDADE */ ];
</script>

<script>
data.sort((a,b)=>a.cargo.localeCompare(b.cargo,"pt-BR"));

const list = document.getElementById("list");
const search = document.getElementById("search");

function render(filter=""){
  list.innerHTML="";
  data.forEach(item=>{
    const cargoMatch = item.cargo.toLowerCase().includes(filter);
    const pessoas = item.pessoas.filter(p =>
      p.nome.toLowerCase().includes(filter) ||
      (p.funcao && p.funcao.toLowerCase().includes(filter))
    );
    if(!cargoMatch && pessoas.length===0) return;

    const card=document.createElement("div");
    card.className="card";

    let html=`<div class="cargo">${item.cargo}</div>`;

    (cargoMatch?item.pessoas:pessoas).forEach(p=>{
      const isDiretor = p.funcao && p.funcao.toLowerCase().includes("diretor");
      html+=`
        <div class="pessoa">
          <span>${p.nome}</span>
          ${p.funcao ? `<span class="funcao ${isDiretor?'diretor':''}">${p.funcao}</span>` : ""}
        </div>`;
    });

    card.innerHTML=html;
    list.appendChild(card);
  });
}

search.addEventListener("input",e=>render(e.target.value.toLowerCase()));
render();
</script>

</body>
</html>
