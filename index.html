<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CARGOS IASD IGUAÍBA – 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c7ddff">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#c7ddff;
  --bg2:#e4efff;
  --card:#eef4ff;
  --border:#b6ccf5;
  --primary:#1e3a8a;
  --text:#0f172a;
  --muted:#475569;
  --highlight:#15803d;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
}

/* TOPO */
header{
  padding:26px 16px 18px;
  text-align:center;
}

.logo-box{
  display:flex;
  justify-content:center;
  margin-bottom:6px;
}

.logo-box img{
  width:140px;
  padding:4px;
  border-radius:14px;
  background:transparent;
}

header h1{
  margin:8px 0 4px;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

header p{
  margin:0;
  font-size:14px;
  color:var(--muted);
}

/* BUSCA */
.search-box{
  padding:0 16px 22px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#f4f8ff;
  color:var(--text);
  font-size:16px;
}

/* LISTA */
#list{
  padding:0 12px 32px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
}

.cargo{
  font-size:18px;
  font-weight:700;
  color:var(--primary);
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

.pessoa{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  font-size:15px;
}

.pessoa:not(:last-child){
  border-bottom:1px dashed var(--border);
}

.funcao{
  font-size:13px;
  font-weight:600;
  padding:4px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--muted);
  background:#e6efff;
}

.funcao.diretor{
  background:var(--highlight);
  color:#ffffff;
  border-color:var(--highlight);
}

/* RODAPÉ */
footer{
  text-align:center;
  font-size:12px;
  color:#334155;
  padding:20px 10px 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo-box">
    <img src="logo-iasd.png" alt="Igreja Adventista do Sétimo Dia">
  </div>
  <h1>CARGOS IASD IGUAÍBA – 2026</h1>
  <p>Igreja Adventista do Sétimo Dia</p>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 Pesquisar nome, cargo ou função">
</div>

<div id="list"></div>

<footer>
  Igreja Adventista do Sétimo Dia • Iguaíba • 2026
</footer>

<script>
// ================= BUSCA SEM ACENTO =================
function normalize(text){
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

// ================= DADOS COMPLETOS =================
let data = [
{ cargo:"Ação Solidária Adventista", pessoas:[{nome:"Josiane Gomes",funcao:"Diretora"},{nome:"Inácia Costa",funcao:"Associada"}]},
{ cargo:"Ancião Administrativo", pessoas:[{nome:"José Ribamar Junior"}]},

{ cargo:"Comunicação", pessoas:[{nome:"Ellayne Crystine",funcao:"Diretora"},{nome:"Eliedson Raposo",funcao:"Associado"}]},
{ cargo:"Coordenador de Interessados", pessoas:[{nome:"Viviane Gomes",funcao:"Diretora"},{nome:"Flavia Cristina",funcao:"Associada"}]},
{ cargo:"Diaconisa Chefe", pessoas:[{nome:"Sirle Sá"}]},
{ cargo:"Diaconisas", pessoas:[{nome:"Gilvana Conceição"},{nome:"Hildene Frazão"},{nome:"Inácia Costa"},{nome:"Jacilene Selares"},{nome:"Marlete Sousa"},{nome:"Merineide de Sousa"}]},
{ cargo:"Diácono Chefe", pessoas:[{nome:"Amarildo Silva"}]},
{ cargo:"Diáconos", pessoas:[{nome:"Alcionor Frazão"},{nome:"Fernando Silva"},{nome:"Aldonio Vieira"},{nome:"Hermes Junior"},{nome:"Iago Ricardo"},{nome:"Igor Rodrigo"},{nome:"Jardson Frazão"},{nome:"Jonathan Pereira"},{nome:"Jonns William"},{nome:"Joseph Santos"},{nome:"Leandro Silva"}]},
{ cargo:"Escola Sabatina", pessoas:[{nome:"Jacilene Selares",funcao:"Diretora"},{nome:"Ana Beatriz",funcao:"Associada"}]},
{ cargo:"Evangelismo", pessoas:[{nome:"Benerides Selares",funcao:"Diretora"}]},
{ cargo:"Liberdade Religiosa", pessoas:[{nome:"Iago Ricardo",funcao:"Diretor"}]},
{ cargo:"Ministério da Criança", pessoas:[{nome:"Ana Karla",funcao:"Diretora"},{nome:"Ana Sara",funcao:"Associada"}]},
{ cargo:"Ministério da Família", pessoas:[{nome:"Jailson Ribeiro",funcao:"Diretor"},{nome:"Polyana Pereira",funcao:"Diretora"}]},
{ cargo:"Ministério da Mulher", pessoas:[{nome:"Joelma Sá",funcao:"Diretora"},{nome:"Sirle Sá",funcao:"Associada"}]},
{ cargo:"Ministério das Possibilidades", pessoas:[{nome:"Jadia Thais",funcao:"Diretora"}]},
{ cargo:"Ministério do Adolescente", pessoas:[{nome:"Andreyna Nunes",funcao:"Diretora"},{nome:"Ana Clara",funcao:"Associada"},{nome:"Leandro Silva",funcao:"Associado"}]},
{ cargo:"Ministério dos Aventureiros", pessoas:[{nome:"Ana Clara",funcao:"Diretora"},{nome:"Joellyny Marcelly",funcao:"Associada"},{nome:"Leandro Silva",funcao:"Associado"}]},
{ cargo:"Ministério dos Desbravadores", pessoas:[{nome:"Ana Beatriz",funcao:"Diretora"},{nome:"Evilla Wanessa",funcao:"Associada"},{nome:"Glauber Ruan",funcao:"Associado"}]},
{ cargo:"Ministério dos Homens", pessoas:[{nome:"Iago Ricardo",funcao:"Diretor"}]},
{ cargo:"Ministério Jovem", pessoas:[{nome:"Igor Rodrigo",funcao:"Diretor"},{nome:"Joellyny Marcelly",funcao:"Associada"}]},
{ cargo:"Ministério Pessoal", pessoas:[{nome:"Fernando Silva",funcao:"Diretor"},{nome:"Joelma Sá",funcao:"Associada"}]},
{ cargo:"Mordomia Cristã", pessoas:[{nome:"José Nunes",funcao:"Diretor"},{nome:"Jonns William",funcao:"Associado"}]},
{ cargo:"Música", pessoas:[{nome:"Yan Cristhian",funcao:"Diretor"},{nome:"Ana Sara",funcao:"Equipe"},{nome:"Jadia Thais",funcao:"Equipe"},{nome:"Ana Vitória",funcao:"Equipe"}]},
{ cargo:"Patrimônio", pessoas:[{nome:"Elias Lima",funcao:"Diretor"}]},
{ cargo:"Pequenos Grupos", pessoas:[{nome:"José Ribamar Junior",funcao:"Diretor"},{nome:"Jailson Ribeiro",funcao:"Associado"}]},
{ cargo:"Publicações", pessoas:[{nome:"Jonathan Pereira",funcao:"Diretor"}]},
{ cargo:"Recepção", pessoas:[{nome:"Merindalva de Sousa",funcao:"Diretora"},{nome:"Camila Santos",funcao:"Associada"}]},
{ cargo:"Saúde", pessoas:[{nome:"Ana Ricarda",funcao:"Diretora"},{nome:"Andreyna Nunes",funcao:"Associada"}]},
{ cargo:"Secretaria", pessoas:[{nome:"Joseph Santos",funcao:"Diretor"}]},
{ cargo:"Sonoplastia", pessoas:[{nome:"Jonns William",funcao:"Diretor"},{nome:"Ericles Felipe",funcao:"Equipe"},{nome:"Eliedson Raposo",funcao:"Equipe"},{nome:"Joseph Santos",funcao:"Equipe"},{nome:"Yan Cristhian",funcao:"Equipe"}]},
{ cargo:"Tesouraria", pessoas:[{nome:"Jonathan Pereira",funcao:"Diretor"},{nome:"Yan Cristhian",funcao:"Associado"}]}
];

data.sort((a,b)=>a.cargo.localeCompare(b.cargo,"pt-BR"));

const list=document.getElementById("list");
const search=document.getElementById("search");

function render(filter=""){
  const f = normalize(filter);
  list.innerHTML="";
  data.forEach(item=>{
    const cargoMatch = normalize(item.cargo).includes(f);
    const pessoas = item.pessoas.filter(p =>
      normalize(p.nome).includes(f) ||
      (p.funcao && normalize(p.funcao).includes(f))
    );
    if(!cargoMatch && pessoas.length===0) return;

    const card=document.createElement("div");
    card.className="card";

    let html=`<div class="cargo">${item.cargo}</div>`;
    (cargoMatch?item.pessoas:pessoas).forEach(p=>{
      const isDiretor=p.funcao&&p.funcao.toLowerCase().includes("diretor");
      html+=`<div class="pessoa"><span>${p.nome}</span>${p.funcao?`<span class="funcao ${isDiretor?'diretor':''}">${p.funcao}</span>`:""}</div>`;
    });

    card.innerHTML=html;
    list.appendChild(card);
  });
}

search.addEventListener("input",e=>render(e.target.value));
render();
</script>

</body>
</html>
