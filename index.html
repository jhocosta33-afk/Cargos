<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CARGOS IASD IGUAÍBA – 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c7ddff">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#c7ddff;
  --bg2:#e4efff;
  --card:#eaf2ff;
  --border:#b6ccf5;
  --primary:#1e40af;
  --text:#0f172a;
  --muted:#475569;
  --highlight:#2563eb;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
}

/* ===== TOPO ===== */
header{
  padding:26px 16px 18px;
  text-align:center;
}

.logo-box{
  display:flex;
  justify-content:center;
  margin-bottom:8px;
}

.logo-box img{
  width:190px;
  padding:0;
  background:none;
  border-radius:0;
  box-shadow:none;
}

header h1{
  margin:10px 0 4px;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

header p{
  margin:0;
  font-size:14px;
  color:var(--muted);
}

/* ===== BUSCA ===== */
.search-box{
  padding:0 16px 22px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#f4f8ff;
  color:var(--text);
  font-size:16px;
}

/* ===== LISTA ===== */
#list{
  padding:0 12px 32px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 6px 16px rgba(30,64,175,.18);
}

.cargo{
  font-size:18px;
  font-weight:700;
  color:var(--primary);
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

.pessoa{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  font-size:15px;
}

.pessoa:not(:last-child){
  border-bottom:1px dashed var(--border);
}

.funcao{
  font-size:13px;
  font-weight:600;
  padding:4px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--muted);
  background:#e6efff;
}

.funcao.diretor{
  background:var(--highlight);
  color:#ffffff;
  border-color:var(--highlight);
}

/* ===== RODAPÉ ===== */
footer{
  text-align:center;
  font-size:12px;
  color:#334155;
  padding:20px 10px 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo-box">
    <img src="logo-iasd.png" alt="Igreja Adventista do Sétimo Dia">
  </div>
  <h1>CARGOS IASD IGUAÍBA – 2026</h1>
  <p>Igreja Adventista do Sétimo Dia</p>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 Pesquisar nome, cargo ou função">
</div>

<div id="list"></div>

<footer>
  Igreja Adventista do Sétimo Dia • Iguaíba • 2026
</footer>

<script>
// ===== FUNÇÃO PARA REMOVER ACENTOS (APENAS PARA BUSCA) =====
function normalize(text){
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

let data = [
  { cargo:"Ação Solidária Adventista", pessoas:[{nome:"Josiane Gomes",funcao:"Diretora"},{nome:"Inácia Costa",funcao:"Associada"}]},
  { cargo:"Ancião Administrativo", pessoas:[{nome:"José Ribamar Junior"}]},
  { cargo:"Ancionato", pessoas:[{nome:"Fernando Silva"},{nome:"Iago Ricardo"},{nome:"Jailson Ribeiro"},{nome:"José Ribamar Junior"}]},
  { cargo:"Círculo de Oração", pessoas:[{nome:"Benerides Selares",funcao:"Diretora"}]},
  { cargo:"Comunicação", pessoas:[{nome:"Ellayne Crystine",funcao:"Diretora"},{nome:"Eliedson Raposo",funcao:"Associado"}]},
  { cargo:"Diáconos", pessoas:[{nome:"Alcionor Frazão"},{nome:"Fernando Silva"},{nome:"Aldonio Vieira"},{nome:"Hermes Junior"},{nome:"Iago Ricardo"}]}
];

data.sort((a,b)=>a.cargo.localeCompare(b.cargo,"pt-BR"));

const list=document.getElementById("list");
const search=document.getElementById("search");

function render(filter=""){
  list.innerHTML="";
  data.forEach(item=>{
    const cargoMatch = normalize(item.cargo).includes(filter);
    const pessoas = item.pessoas.filter(p =>
      normalize(p.nome).includes(filter) ||
      (p.funcao && normalize(p.funcao).includes(filter))
    );

    if(!cargoMatch && pessoas.length===0) return;

    const card=document.createElement("div");
    card.className="card";

    let html=`<div class="cargo">${item.cargo}</div>`;
    (cargoMatch?item.pessoas:pessoas).forEach(p=>{
      const isDiretor = p.funcao && normalize(p.funcao).includes("diretor");
      html+=`
        <div class="pessoa">
          <span>${p.nome}</span>
          ${p.funcao ? `<span class="funcao ${isDiretor?'diretor':''}">${p.funcao}</span>` : ""}
        </div>`;
    });

    card.innerHTML=html;
    list.appendChild(card);
  });
}

search.addEventListener("input",e=>{
  render(normalize(e.target.value));
});

render();
</script>

</body>
</html>
